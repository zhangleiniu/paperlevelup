<text x="26" y="68" xml:space="preserve"><tspan fill="#8b9099">&gt; </tspan><tspan fill="#f3f4f6" font-weight="600">I read a paper that learned paper embeddings from citations, AI2 I think?</tspan></text>
<text x="26" y="103" xml:space="preserve"><tspan fill="#e0915e">● </tspan><tspan>Most likely: </tspan><tspan fill="#9db4f0">SPECTER: Document-level Representation Learning</tspan></text>
<text x="26" y="124" xml:space="preserve"><tspan>  </tspan><tspan fill="#9db4f0">using Citation-informed Transformers</tspan><tspan fill="#8b9099"> (Cohan et al., ACL 2020)</tspan></text>
<text x="26" y="145" xml:space="preserve"><tspan>  </tspan><tspan>Fairly sure: it trains a transformer so that papers that cite each</tspan></text>
<text x="26" y="166" xml:space="preserve"><tspan>  </tspan><tspan>other end up close, and the authors are at AI2.</tspan></text>
<text x="26" y="187" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b9099">Close alternative: </tspan><tspan>SciNCL</tspan><tspan fill="#8b9099"> (Ostendorff et al., EMNLP 2022)</tspan></text>
</g>
